<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>PS1 test</title>
<style>
html,body{margin:0;background:#000;width:1920px;height:1080px;overflow:hidden}
#gl{position:absolute;left:0;top:0;width:1920px;height:1080px;image-rendering:pixelated;image-rendering:crisp-edges}
#ov{position:absolute;left:0;top:0;width:1920px;height:1080px;font-family:"Noto Sans CJK SC","Noto Sans SC","Source Han Sans SC","WenQuanYi Micro Hei",sans-serif;color:#F3E6C8}
.abs{position:absolute}
#scrim{left:0;top:0;width:1300px;height:420px;background:radial-gradient(ellipse at 20% 25%,rgba(30,10,0,.55),rgba(30,10,0,0) 70%)}
#sub{left:120px;top:90px;font-size:56px;font-weight:700;line-height:80px;white-space:nowrap;
 text-shadow:0 2px 4px rgba(20,8,0,.85),0 4px 18px rgba(20,8,0,.8)}
.hl{text-decoration:underline;text-decoration-color:#C9A24A;text-decoration-thickness:4px;text-underline-offset:8px;text-decoration-skip-ink:none}
#stamp{right:130px;top:70px;text-align:right;white-space:nowrap;padding-right:0;text-shadow:0 2px 8px rgba(20,8,0,.8)}
#stamp .l1{font-size:32px;font-weight:700;line-height:42px}
#stamp .l2{font-size:24px;opacity:.7;line-height:34px}
#hair{left:1800px;top:70px;width:2px;height:76px;background:#C9A24A}
#bar{right:120px;top:166px;display:flex;gap:6px;padding:6px;background:rgba(20,8,0,.55);border:2px solid #F3E6C8}
.seg{width:24px;height:16px;background:#35E6F2;box-shadow:inset 0 -4px 0 #12A5B5,inset 0 4px 0 #D8FFFF}
.seg.off{background:#2a1608;box-shadow:inset 0 0 0 1px #5a3a1a}
#seal{right:130px;bottom:65px;width:70px;height:70px;opacity:.65}
#card{left:0;top:0;width:1920px;height:1080px}
#c1{left:0;width:1920px;top:640px;text-align:center;font-size:120px;font-weight:700;letter-spacing:10px;text-shadow:0 0 24px rgba(53,230,242,.35)}
#c2{left:0;width:1920px;top:800px;text-align:center;font-size:36px;letter-spacing:14px;opacity:.85;font-family:"DejaVu Sans Mono",monospace;font-weight:700}
#load{right:120px;bottom:70px;image-rendering:pixelated}
</style></head><body>
<canvas id="gl" width="384" height="216"></canvas>
<div id="ov">
 <div id="card">
  <div id="c1" class="abs">第3天</div><div id="c2" class="abs">DAY 3</div>
  <canvas id="load" class="abs" width="75" height="9"></canvas>
 </div>
 <div id="game">
  <div id="scrim" class="abs"></div>
  <div id="sub" class="abs"></div>
  <div id="stamp" class="abs"><div class="l1">第3天 · 失水约5%</div><div class="l2">Exp Physiol 2025</div></div>
  <div id="hair" class="abs"></div>
  <div id="bar" class="abs"></div>
  <svg id="seal" class="abs" viewBox="0 0 70 70" fill="none" stroke="#F3E6C8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
   <circle cx="35" cy="35" r="32"/><path d="M41 17V43Q41 52 33 52Q26 52 24 46"/>
  </svg>
 </div>
</div>
<script type="module" src="./main.js"></script>
</body></html>
