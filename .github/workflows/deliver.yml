name: deliver-drivetest
on:
  push:
    branches: [deliver-drivetest]
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Join parts and check
        run: |
          mkdir -p out
          cat parts/master.mp4.part* > "out/测试_v1_高清原片.mp4"
          echo "$(cat parts/md5.txt)  out/测试_v1_高清原片.mp4" | md5sum -c -
          ls -la out phone
      - uses: actions/upload-artifact@v4
        with:
          name: 测试_v1_高清原片
          path: out/测试_v1_高清原片.mp4
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: 测试_v1_手机版
          path: phone/测试_v1_手机版.mp4
          compression-level: 0
          retention-days: 1
  drive:
    needs: package
    uses: jayjiao-debug/Video/.github/workflows/drive-upload.yml@claude/drive-delivery
    with: { artifacts: "测试_v1_*", folder: "drivetest", delete_branch: true }
    secrets: inherit
