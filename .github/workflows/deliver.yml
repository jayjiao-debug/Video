name: deliver-bh360demo
on:
  push:
    branches: [deliver-bh360demo]
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Join parts and check
        run: |
          mkdir -p out
          cat parts/master.mp4.part* > "out/掉进黑洞_demo30_360全景_高清原片.mp4"
          echo "$(cat parts/md5.txt)  out/掉进黑洞_demo30_360全景_高清原片.mp4" | md5sum -c -
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: 掉进黑洞_demo30_360全景_高清原片
          path: out/掉进黑洞_demo30_360全景_高清原片.mp4
          compression-level: 0
          retention-days: 30
