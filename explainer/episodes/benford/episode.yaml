# 《第一位数字》: why so many numbers start with 1 (Benford's law)
#
# Status: storyboard draft, waiting for the owner's approval and the track (anchors are planned, not yet timed).
#
# Sources (checked):
#   Newcomb, S. (1881). Note on the Frequency of Use of the Different Digits in Natural Numbers.
#     American Journal of Mathematics 4(1): 39–40. Opening: the first pages of logarithm tables
#     "wear out" faster than the last ones. Newcomb: astronomer, US Nautical Almanac Office, Washington.
#   Benford, F. (1938). The Law of Anomalous Numbers. Proc. American Philosophical Society 78(4): 551–572.
#     Physicist at General Electric (Schenectady). 20 tables, 20,229 observations: river areas (335),
#     populations (3,259), physical constants (104), molecular weights, Reader's Digest numbers,
#     street addresses (342), death rates (418) …
#   P(d) = log10(1 + 1/d): 1 → 30.1 %, 9 → 4.6 % (a flat guess would be 11.1 % each).
#   Growth illustration (our own toy model, 示意): +10 %/yr, 1,000 → 2,000 takes ln2/ln1.1 ≈ 7.3 yr,
#     9,000 → 10,000 takes ln(10/9)/ln1.1 ≈ 1.1 yr; 1,000 → 10,000 ≈ 24.2 yr; 7.3/24.2 ≈ 30 %.
#   State of Arizona v. Wayne James Nelson (CV92-18841, 1993): a manager in the Arizona State
#     Treasurer's office wrote 23 cheques to a bogus vendor, nearly $2 million; over 90 % of the amounts
#     began with 7, 8 or 9, most just under $100,000 (Nigrini, Journal of Accountancy, May 1999).
#   Rauch, Göttsche, Brähler & Engel (2011). Fact and Fiction in EU-Governmental Economic Data.
#     German Economic Review 12(3): 243–255: Greece's reported data deviated most from Benford of all
#     EU members (as told by Tim Harford, 2011). Hedged in the script as "一项研究发现".
#   Counter-examples: adult heights in metres (all 1.x), phone numbers, lottery balls: narrow range or
#     assigned numbers, so no Benford pattern.
#
# Line markup: [gold] highlights the answer, {red} the trap.

id: benford
series: Juno · VIBE知识大赏
title: 第一位数字
subtitle: 为什么1开头的数字最多？
format: horizontal
fps: 30
music: assets/music/benford-bgm.mp3   # the owner's track (not in git). 118 bpm, 164.5 s
markers:
  a: 3.90      # title card: first stamp on this accent; 4.40 (the strongest) lands the third character
  b: 16.61     # the first full section: through the window into the study
  # break 49.17 · build 65.45 · drop 82.24 come from the analysis

scenes:
  - id: hook
    component: Hook
    lead: 0.33
    tail: 0
    lines:
      - {text: 世上的数字，第一位最常是几？, hold: 2.04}
      - {text: "[1]。是9的六倍还多。", hold: 1.5}

  - id: office
    component: Office
    at: a
    lead: 4.67  # the title card plays first (3.90 → 8.47, cut on the 8.47 accent)
    props: {quietLead: true}
    kicker: 1881 · 华盛顿
    lines:
      - 1881年，华盛顿。
      - 美国航海历书局，灯还亮着。

  - id: study
    component: Study
    at: b
    kicker: 美国航海历书局
    lines:
      - pause: 1.2
      - 那时没有计算器。
      - 天文学家纽康，要算行星的位置。
      - 一颗行星，就是成千上万次乘法。
      - 诀窍是查[对数表]：乘法，变成加法。

  - id: tabs
    component: Tabs
    kicker: 表是按第一位数字排的
    lines:
      - 表按第一位数字排：1开头的在前，9开头的在后。
      - 如果数字是随机的，1到9机会均等。
      - 每一段，{都该被翻得一样多}。
      - pause: 1.5

  - id: twist
    component: Twist
    at: break
    kicker: 灯下的书口
    lines:
      - {text: 不。, hold: 2.2}
      - 越往前，越黑。
      - 他写了两页纸。然后，没人在意。

  - id: benford
    component: Benford
    kicker: 1938 · 斯克内克塔迪 · 通用电气
    lines:
      - 57年后，本福特发现了同一件事。
      - 河流、人口、物理常数、门牌号……
      - 他收集了[20,229]个数字。

  - id: town
    component: Town
    at: build
    kicker: 一个小镇 · 示意
    lines:
      - 小镇人口，每年涨一成。
      - 从1千到2千：7年。
      - 从9千到1万：1年。
      - 到了1万，又回到1开头。
      - {text: 1开头的数，到底占多少？, hold: 2.4}

  - id: reveal
    component: Reveal
    at: drop
    kicker: BENFORD'S LAW
    cite: Benford, 1938
    lines:
      - 约[三成]，以1开头。
      - 以9开头的，[不到5%]。
      - 它叫[本福特定律]。

  - id: cheques
    component: Cheques
    kicker: 1993 · 亚利桑那州财政办公室
    cite: State of Arizona v. Nelson, 1993
    lines:
      - 1993年，一位经理开出23张支票。
      - 金额是他自己{随手编的}。
      - 九成以上，以7、8、9开头。
      - 审计一比，[一眼就露馅]。
      - 一项研究发现：希腊报给欧盟的数据，偏得最远。

  - id: city
    component: City
    kicker: 哪些数字偏爱1
    lines:
      - 股价、账单、河长、文件大小……
      - 自然增长、跨越很多量级的数，[都偏爱1]。
      - 身高、电话号码、彩票号码——不算。
      - ①数字要跨越好几个量级。
      - ②人编的数，往往{太平均}。
      - ③1开头最多，是[增长的形状]。

  - id: coda
    component: Coda
    at: 146.5
    lines:
      - 回到那本书。
      - 翻黑它的，不是某一个人。
      - 是整个世界的[增长方式]。
      - pause: 6   # end card
