<!doctype html>
<html><head><meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1920px; height:1080px; overflow:hidden; background:#0a0612; font-family:'Noto Sans CJK SC','Noto Sans SC',sans-serif; }
  .stage { position:relative; width:1920px; height:1080px; background:
      radial-gradient(ellipse 1600px 1200px at 50% 62%, #241536 0%, #150c24 52%, #0a0612 85%); }

  .feed { position:absolute; inset:0; opacity:.4; overflow:hidden; }
  .feed-col { position:absolute; top:-40px; width:200px; display:flex; flex-direction:column; gap:26px; filter:blur(.2px); }
  .feed-line { height:12px; border-radius:7px; background: linear-gradient(90deg, rgba(255,70,140,.5), rgba(90,140,255,.4)); }

  .scanlines { position:absolute; inset:0; opacity:.12; background-image: repeating-linear-gradient(180deg, rgba(255,255,255,.5) 0 1px, transparent 1px 3px); mix-blend-mode:overlay; z-index:9;}

  /* figure, face clearly in frame, held low and lit only from below by the phone's glow -- dark everywhere the glow doesn't reach */
  .figure { position:absolute; left:50%; top:60px; transform:translateX(-50%); width:620px; height:700px; z-index:3; }
  .shoulders { position:absolute; left:50%; bottom:0; transform:translateX(-50%); width:620px; height:320px;
      border-radius:270px 270px 0 0; background:#120a1c; }
  .shoulders .underlight { position:absolute; left:0; right:0; top:0; height:48%;
      background: linear-gradient(0deg, rgba(255,90,175,.45) 0%, rgba(140,90,255,.18) 55%, transparent 100%); }
  .head { position:absolute; left:50%; bottom:270px; transform:translateX(-50%); width:270px; height:300px;
      border-radius:50% 50% 46% 46%/56% 56% 44% 44%; background:#120a1c; overflow:hidden; }
  .head .underlight { position:absolute; left:0; right:0; bottom:0; height:58%;
      background: linear-gradient(0deg, rgba(255,140,210,.9) 0%, rgba(200,110,255,.4) 44%, rgba(140,90,255,0) 100%); }
  .head .jaw-hot { position:absolute; left:50%; bottom:0; transform:translateX(-50%); width:70%; height:22%; border-radius:50% 50% 40% 40%/80% 80% 20% 20%;
      background: radial-gradient(ellipse at 50% 100%, rgba(255,210,240,.95) 0%, rgba(255,120,200,.5) 60%, transparent 100%); }
  /* chromatic ghost offsets on the jaw-hot highlight only -- a glitch accent on the lit edge, not the whole frame */
  .head .jaw-ghost-r { position:absolute; left:50%; bottom:0; transform:translate(calc(-50% + 4px),0); width:70%; height:22%; border-radius:50% 50% 40% 40%/80% 80% 20% 20%;
      background: radial-gradient(ellipse at 50% 100%, rgba(255,0,90,.3) 0%, transparent 70%); mix-blend-mode:screen; }
  .head .jaw-ghost-c { position:absolute; left:50%; bottom:0; transform:translate(calc(-50% - 4px),0); width:70%; height:22%; border-radius:50% 50% 40% 40%/80% 80% 20% 20%;
      background: radial-gradient(ellipse at 50% 100%, rgba(0,220,255,.25) 0%, transparent 70%); mix-blend-mode:screen; }

  .rim-light { position:absolute; left:50%; bottom:0; transform:translateX(-50%); width:1300px; height:980px; pointer-events:none; z-index:1;
      background: radial-gradient(ellipse 700px 900px at 50% 100%, rgba(255,90,170,.4) 0%, rgba(140,90,255,.2) 40%, transparent 70%); }

  .phone { position:absolute; left:50%; bottom:20px; transform:translateX(-50%); width:320px; height:470px; border-radius:36px;
      background:#050208; box-shadow:0 40px 120px rgba(0,0,0,.7); z-index:6; }
  .screen { position:absolute; inset:16px; border-radius:26px; overflow:hidden; background:#07030d; }
  .glow-main { position:absolute; inset:0; background: radial-gradient(ellipse at 50% 30%, rgba(255,80,170,.95) 0%, rgba(150,90,255,.6) 40%, rgba(30,15,40,.25) 72%); }
  .glitch-bar { position:absolute; left:0; right:0; height:12px; background:#fff; mix-blend-mode:screen; opacity:.75; }
  .ghost-r { position:absolute; inset:0; background: radial-gradient(ellipse at 50% 30%, rgba(255,0,90,.5) 0%, transparent 55%); mix-blend-mode:screen; transform: translateX(6px); }
  .ghost-c { position:absolute; inset:0; background: radial-gradient(ellipse at 50% 30%, rgba(0,220,255,.45) 0%, transparent 55%); mix-blend-mode:screen; transform: translateX(-6px); }
  .clock { position:absolute; left:0; right:0; top:58%; text-align:center; font-family:'DejaVu Sans Mono',monospace; font-weight:700;
      font-size:54px; color:#fff; text-shadow: 3px 0 0 rgba(255,0,90,.8), -3px 0 0 rgba(0,220,255,.8); letter-spacing:2px; }

  .corner-mark { position:absolute; top:34px; right:40px; width:56px; height:56px; border-radius:14px;
      background: rgba(6,8,13,.55); display:flex; align-items:center; justify-content:center;
      font-family:'Cormorant Garamond', serif; font-weight:600; font-size:34px; color:#D4AF6A;
      border:1px solid rgba(212,175,106,.4); z-index:10; }
  .subtitle-wrap { position:absolute; left:0; right:0; top:860px; display:flex; justify-content:center; z-index:10;}
  .subtitle { background: rgba(6,8,13,.80); border-radius:18px; padding:10px 34px;
      font-weight:900; font-size:64px; color:#fff; letter-spacing:2px; white-space:nowrap; }
  .subtitle .gold { color:#D4AF6A; }
</style></head>
<body>
<div class="stage">
  <div class="feed">
    <div class="feed-col" style="left:60px;">
      <div class="feed-line" style="width:180px"></div><div class="feed-line" style="width:120px"></div>
      <div class="feed-line" style="width:200px"></div><div class="feed-line" style="width:90px"></div>
    </div>
    <div class="feed-col" style="left:1700px;">
      <div class="feed-line" style="width:170px"></div><div class="feed-line" style="width:110px"></div>
      <div class="feed-line" style="width:190px"></div><div class="feed-line" style="width:130px"></div>
    </div>
  </div>

  <div class="rim-light"></div>
  <div class="figure">
    <div class="shoulders"><div class="underlight"></div></div>
    <div class="head">
      <div class="underlight"></div>
      <div class="jaw-ghost-r"></div>
      <div class="jaw-ghost-c"></div>
      <div class="jaw-hot"></div>
    </div>
  </div>

  <div class="phone">
    <div class="screen">
      <div class="glow-main"></div>
      <div class="ghost-r"></div>
      <div class="ghost-c"></div>
      <div class="glitch-bar" style="top:70px;"></div>
      <div class="glitch-bar" style="top:220px; height:5px; opacity:.5;"></div>
      <div class="clock">2:00</div>
    </div>
  </div>

  <div class="scanlines"></div>
  <div class="corner-mark">J</div>
  <div class="subtitle-wrap"><div class="subtitle">凌晨<span class="gold">两点</span></div></div>
</div>
</body></html>
