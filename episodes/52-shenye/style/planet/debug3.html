<!doctype html><html><head><script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script></head>
<body><canvas id="c"></canvas>
<script>
const renderer = new THREE.WebGLRenderer({canvas:document.getElementById('c'), preserveDrawingBuffer:true});
renderer.setSize(800,600);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x222244);
const camera = new THREE.PerspectiveCamera(50, 800/600, 0.1, 100);
camera.position.set(0,0,5);
const cube = new THREE.Mesh(new THREE.BoxGeometry(1,1,1), new THREE.MeshStandardMaterial({color:0xff4422}));
scene.add(cube);
const light = new THREE.DirectionalLight(0xffffff,1);
light.position.set(2,2,2);
scene.add(light);
scene.add(new THREE.AmbientLight(0xffffff,0.4));
renderer.render(scene,camera);
window.__done = true;
</script></body></html>
