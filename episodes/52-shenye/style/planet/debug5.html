<!doctype html><html><head><script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script></head>
<body><canvas id="c"></canvas>
<script>
const renderer = new THREE.WebGLRenderer({canvas:document.getElementById('c'), preserveDrawingBuffer:true});
renderer.setSize(960,540);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.4;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05060c);
const camera = new THREE.PerspectiveCamera(38, 960/540, 0.1, 200);
// look down at the planet's "north pole" (top) from a 3/4 high angle
camera.position.set(1.6, 5.4, 6.0);
camera.lookAt(0, 3.8, 0.3);

const planetR = 3.4;
const planetMat = new THREE.MeshStandardMaterial({color:0x242f52, roughness:0.85, metalness:0.05});
const planetMesh = new THREE.Mesh(new THREE.SphereGeometry(planetR, 64, 64), planetMat);
scene.add(planetMesh);

const bedMarker = new THREE.Mesh(new THREE.BoxGeometry(1.5,0.3,0.9), new THREE.MeshStandardMaterial({color:0xd98a46}));
bedMarker.position.set(0, planetR+0.5, 0.4);
scene.add(bedMarker);

const key = new THREE.DirectionalLight(0xffffff, 1.2);
key.position.set(-3,6,2);
scene.add(key);
const fill = new THREE.AmbientLight(0x3a4570, 0.8);
scene.add(fill);
const bounce = new THREE.HemisphereLight(0x55628f, 0x0a0812, 0.6);
scene.add(bounce);

renderer.render(scene,camera);
window.__done = true;
</script></body></html>
