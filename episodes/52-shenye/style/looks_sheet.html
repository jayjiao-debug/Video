<!doctype html>
<html><head><meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1920px; height:1080px; background:#0b0b0e; font-family:'Noto Sans CJK SC','Noto Sans SC',sans-serif; overflow:hidden; }
  .wrap { display:grid; grid-template-columns: 170px repeat(3, 1fr); grid-template-rows: 54px repeat(3, 1fr); width:1920px; height:1080px; }
  .col-label { display:flex; align-items:center; justify-content:center; color:#D4AF6A; font-weight:800; font-size:20px; letter-spacing:1px; background:#101014; border-bottom:1px solid #222; }
  .row-label { display:flex; align-items:center; justify-content:center; writing-mode:vertical-rl; text-orientation:mixed; color:#fff; font-weight:900; font-size:22px; background:#141418; border-right:1px solid #222; letter-spacing:2px; }
  .cell { position:relative; border:1px solid #1c1c20; overflow:hidden; }
  .cell img { width:100%; height:100%; object-fit:cover; display:block; }
  .corner { grid-column:1; grid-row:1; background:#101014; }
</style></head>
<body>
<div class="wrap">
  <div class="corner"></div>
  <div class="col-label">a · 开头 HOOK</div>
  <div class="col-label">b · 大脑机制 BRAIN</div>
  <div class="col-label">c · 高潮 DROP</div>

  <div class="row-label">A 夜灯手账<br>NIGHT LEDGER</div>
  <div class="cell"><img src="ledger/a_hook.png"></div>
  <div class="cell"><img src="ledger/b_brain.png"></div>
  <div class="cell"><img src="ledger/c_drop.png"></div>

  <div class="row-label">B 诊疗观测室<br>LAB SCOPE</div>
  <div class="cell"><img src="lab/a_hook.png"></div>
  <div class="cell"><img src="lab/b_brain.png"></div>
  <div class="cell"><img src="lab/c_drop.png"></div>

  <div class="row-label">C 信号故障<br>SIGNAL GLITCH (bold)</div>
  <div class="cell"><img src="glitch/a_hook.png"></div>
  <div class="cell"><img src="glitch/b_brain.png"></div>
  <div class="cell"><img src="glitch/c_drop.png"></div>
</div>
</body></html>
