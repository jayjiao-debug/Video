const R=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});R.setPixelRatio(1);R.setSize(OW,OH);R.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(R.domElement);

// paper ground with grid
{const c=document.createElement('canvas');c.width=c.height=512;const g=c.getContext('2d');g.fillStyle='#E9E3D5';g.fillRect(0,0,512,512);
 for(let i=0;i<2600;i++){g.fillStyle=`rgba(120,100,70,${Math.random()*0.035})`;g.fillRect(Math.random()*512,Math.random()*512,2,2);}
 g.strokeStyle='rgba(120,105,80,.18)';g.lineWidth=1;for(let i=0;i<=8;i++){g.beginPath();g.moveTo(i*64,0);g.lineTo(i*64,512);g.stroke();g.beginPath();g.moveTo(0,i*64);g.lineTo(512,i*64);g.stroke();}
 g.strokeStyle='rgba(110,95,70,.36)';g.lineWidth=2.5;g.strokeRect(0,0,512,512);
 const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(50,50);t.offset.set(0.5,0.5);t.anisotropy=8;t.colorSpace=THREE.SRGBColorSpace;
 const m=new THREE.Mesh(new THREE.PlaneGeometry(1000,1000),new THREE.MeshBasicMaterial({map:t}));m.rotation.x=-Math.PI/2;S.add(m);}

{const r=new THREE.Mesh(new THREE.RingGeometry(RAD-0.7,RAD+0.7,256),basic(0x2F73C8));r.rotation.x=-Math.PI/2;r.position.y=0.05;S.add(r);

arcLine(70,0.3,1.4,0x7FA38A);arcLine(80,2.2,3.6,0xD2A23A);arcLine(64,4.1,5.2,0x9A86B8);arcLine(90,5.4,6.1,0xC8473A);
// cars (scaled 1.4x so they read in 360)
const sim=ringSim({N:22,L:230,T:40,dt:0.02,every:1,kick:{i:0,t0:KICK,t1:KICK+2.0,dec:3.5}});const OFF=-(sim.frames[Math.round(KICK/sim.dt)].x[0]/230)*2*Math.PI;window.SIMOFF=OFF;

 for(const seg of txt.split(/(\[[^\]]+\])/).filter(Boolean)){const gold=seg.startsWith('[');const s=gold?seg.slice(1,-1):seg;g.fillStyle=gold?'#f6cf78':'#fff';g.fillText(s,x,102);x+=g.measureText(s).width;}

const lab=panel(1024,320,(g)=>{g.font='900 150px "Noto Sans CJK SC"';g.fillStyle='#1f1b16';g.fillText('230 米的圆',20,170);g.font='700 58px "Noto Sans CJK SC"';g.fillStyle='#6f6556';g.letterSpacing='6px';g.fillText('22 辆车 · 30 km/h',24,262);});
{const m=new THREE.Mesh(new THREE.PlaneGeometry(12.8,4),lab.mat);m.rotation.x=-Math.PI/2;m.position.set(0,0.08,-18);S.add(m);}
const LINES=[[0,3.2,'你站在跑道[正中间]'],[3.2,6.4,'22辆车，绕着你开'],[6.4,9.6,'有一辆车，[慢了一点点]'],[9.6,12.8,'后面的车，一辆接一辆停下'],[12.8,16.4,'听——堵点在[往后跑]']];
