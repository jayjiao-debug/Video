 const bow=new THREE.Mesh(new THREE.ConeGeometry(4.6,9,4),hullM);bow.rotation.z=-Math.PI/2;bow.rotation.x=Math.PI/4;bow.position.set(26,1,0);bow.scale.set(1,1,.7);g.add(bow);
 const deck=new THREE.Mesh(new THREE.BoxGeometry(10,3,6),new THREE.MeshStandardMaterial({color:dark?0x2a2f33:0x6b5a45,flatShading:true}));deck.position.set(-6,5.5,0);g.add(deck);

 });

 const full=g.measureText('ENDURANCE').width,ew=g.measureText('E').width;g.fillStyle='#d8b45a';g.fillText('E',(1024-full)/2,128);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;})();

 const st=new THREE.Mesh(new THREE.CylinderGeometry(.12,.12,2.2),new THREE.MeshStandardMaterial({color:0xffffff}));st.position.y=1.1;g.add(st);g.visible=false;map.add(g);return g;}
const pinSink=pin(0x8899aa),pinNext=pin(0xf2c14e),pinEI=pin(0xf2c14e),pinSG=pin(0xf2c14e),pinFar=pin(0x667788);
pinSink.position.copy(P.sink);pinEI.position.copy(P.ei);pinSG.position.copy(P.stn);pinFar.position.set(-36,.5,-6);pinNext.position.set(-7,.5,9);

const routePts=[P.camp,P.launch,V(-16,.6,22),P.ei,V(-10,.6,40),V(15,.6,55),P.sg,P.stn].map(v=>v.clone().setY(1));

const rGeo=new THREE.BufferGeometry().setFromPoints(rp);const route=new THREE.Line(rGeo,new THREE.LineDashedMaterial({color:0xf2c14e,dashSize:1,gapSize:.6}));route.computeLineDistances();map.add(route);
const tGoal=new THREE.Line(new THREE.BufferGeometry().setFromPoints([V(0,1,0),V(-40,1,-60),V(-90,1,-70)]),new THREE.LineDashedMaterial({color:0xffffff,dashSize:2,gapSize:1.5}));tGoal.computeLineDistances();map.add(tGoal);

const hut=new THREE.Group();hut.position.copy(P.ei);map.add(hut);
[0,1].forEach(i=>{const b=new THREE.Mesh(new THREE.CylinderGeometry(.6,.6,3.2,8,1,false,0,Math.PI),boatM);b.rotation.z=Math.PI/2;b.position.set(0,.4,-.7+i*1.4);hut.add(b);});
