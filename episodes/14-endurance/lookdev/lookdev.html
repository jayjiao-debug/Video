<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}</style></head><body>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {RGBELoader} from 'three/addons/loaders/RGBELoader.js';
import {Water} from 'three/addons/objects/Water.js';
const W=960,H=540;const R=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});R.setSize(W,H);
R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=0.9;R.shadowMap.enabled=true;document.body.appendChild(R.domElement);
const cam=new THREE.PerspectiveCamera(35,W/H,.1,5000);
const gl=new GLTFLoader(),hl=new RGBELoader();
const load=(l,u)=>new Promise((res,rej)=>l.load(u,res,undefined,rej));
const [shipG,cairdG,dusk,sky]=await Promise.all([load(gl,'assets/sailing_ship_cyc3w.glb'),load(gl,'assets/james_caird_watt.glb'),load(hl,'assets/belfast_sunset_puresky_2k.hdr'),load(hl,'assets/kloppenheim_06_puresky_2k.hdr')]);
[dusk,sky].forEach(t=>t.mapping=THREE.EquirectangularReflectionMapping);
function fit(obj,len){const b=new THREE.Box3().setFromObject(obj);const s=b.getSize(new THREE.Vector3());const k=len/Math.max(s.x,s.z);obj.scale.setScalar(k);
 const b2=new THREE.Box3().setFromObject(obj);const c=b2.getCenter(new THREE.Vector3());obj.position.sub(new THREE.Vector3(c.x,b2.min.y,c.z));
 obj.traverse(o=>{if(o.isMesh){o.castShadow=o.receiveShadow=true}});return s;}
window.INFO={ship:fit(shipG.scene,44),caird:fit(cairdG.scene,7)};
// --- ICE SCENE
const ice=new THREE.Scene();ice.background=dusk;ice.environment=dusk;ice.backgroundIntensity=.8;ice.environmentIntensity=.6;
ice.fog=new THREE.FogExp2(0xc89a86,.0028);
const snow=new THREE.Mesh(new THREE.PlaneGeometry(4000,4000,200,200),new THREE.MeshStandardMaterial({color:0xe9eef5,roughness:.85}));
{const p=snow.geometry.attributes.position;for(let i=0;i<p.count;i++){const x=p.getX(i),y=p.getY(i);p.setZ(i,Math.sin(x*.05)*Math.cos(y*.07)*.6+Math.sin(x*.21+y*.13)*.25)}snow.geometry.computeVertexNormals();}
snow.rotation.x=-Math.PI/2;snow.receiveShadow=true;ice.add(snow);
const sun=new THREE.DirectionalLight(0xffb37a,3.2);sun.position.set(-260,45,-300);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-60,right:60,top:60,bottom:-60,far:900});ice.add(sun);
const ship=shipG.scene;ice.add(ship);ship.position.y-=2.2;
// pressure shards along hull
const shardM=new THREE.MeshStandardMaterial({color:0xdfe7f0,roughness:.6,flatShading:true});
let s=3;const r=()=>{s=(s*16807)%2147483647;return s/2147483647};
for(let i=0;i<70;i++){const g=new THREE.Mesh(new THREE.BoxGeometry(2+r()*5,.4+r()*1.2,1.5+r()*4),shardM);const side=i%2?1:-1;
 g.position.set(-24+r()*48,.2+r()*1.5,side*(5+r()*5));g.rotation.set((r()-.5)*1.4,r()*3,(r()-.5)*1.4);g.castShadow=g.receiveShadow=true;ice.add(g);}
// --- SEA SCENE
const sea=new THREE.Scene();sea.background=sky;sea.environment=sky;sea.backgroundIntensity=.55;sea.fog=new THREE.FogExp2(0x8a96a2,.006);
const wn=await new Promise(res=>new THREE.TextureLoader().load('assets/waternormals.jpg',t=>{t.wrapS=t.wrapT=THREE.RepeatWrapping;res(t)}));
const ssun=new THREE.DirectionalLight(0xfff2e0,2.2);ssun.position.set(80,60,-120);sea.add(ssun);
const water=new Water(new THREE.PlaneGeometry(4000,4000,1,1),{textureWidth:512,textureHeight:512,waterNormals:wn,sunDirection:ssun.position.clone().normalize(),sunColor:0xffffff,waterColor:0x1b3442,distortionScale:5,fog:true});
water.rotation.x=-Math.PI/2;sea.add(water);const caird=cairdG.scene;sea.add(caird);
window.READY=true;
window.renderAt=function(t){
 const shot=Math.floor(t);const k=t-shot;
 if(shot<3){ // ship angles
  const a=[2.4,.4,-.3][shot];const rad=[95,60,30][shot],h=[30,8,3][shot];
  cam.position.set(Math.cos(a)*rad,h,Math.sin(a)*rad);cam.lookAt(0,[6,8,10][shot],0);cam.fov=35;cam.updateProjectionMatrix();R.render(ice,cam);
 } else { // caird angles
  water.material.uniforms.time.value=t*2;const by=Math.sin(t*1.3)*.15;caird.position.y=by-.55;caird.rotation.z=Math.sin(t)*.05;
  const a=[.6,2.2,-1.2][shot-3];const rad=[12,9,16][shot-3],h=[1.2,3,.6][shot-3];
  cam.position.set(Math.cos(a)*rad,h,Math.sin(a)*rad);cam.lookAt(0,1,0);R.render(sea,cam);
 }
};
</script></body></html>
