 paper(6,DROP+i*BEAT/4,x,y,250,250,(rnd()-.5)*8,`<div style="height:100%;display:flex;align-items:center;justify-content:center"><span class="num" style="font-size:${blg?84:44}px;color:${blg?'#17130f':'#8a7f70'}">${blg?'BLG':'TES·IG·AL'}</span></div>`,{z:5,pad:'10px',big:i===0});}

// ================= render
function place(c,t){
 const FALL=c.large?.4:c.big?.22:.14, dt=t-c.t;
 if(dt<-FALL){c.el.style.opacity=0;return}
 let sc=1,op=1,rot=c.rot,sh=c.sh,bl=22,dy=0;
 if(dt<0){const u=1+dt/FALL,e=easeIn(u);
  if(c.large){const e2=ease(u);dy=-(1-e2)*1150;rot=c.rot-3*(1-e2);sh=60-42*e2;bl=44-22*e2}   // big sheets slide in from above: no sudden bright frame
  else if(c.big){sc=1.12-.12*e;dy=-(1-e)*1000;rot=c.rot-6*(1-e);sh=70-52*e;bl=50-28*e}
  else{sc=1.25-.25*e;op=cl(u*1.6);rot=c.rot+6*(1-e);sh=70-52*e;bl=50-28*e}}
 else{const b=Math.exp(-dt*14)*Math.sin(dt*38)*.012;sc=1-b}
 c.el.style.opacity=op;c.el.style.transform=`translateY(${dy}px) rotate(${rot}deg) scale(${sc})`;
 c.el.style.filter=`drop-shadow(0 ${sh}px ${bl}px rgba(0,0,0,.55))${c.blur>.05?` blur(${c.blur.toFixed(2)}px)`:''}`;
}
function camX(t){ // one travel direction: glide right to each scene, arriving on its bar
 let x=0;for(let k=1;k<SB.length;k++){const ta=B(SB[k]),u=smooth((t-(ta-.75))/.85);x+=GAP*u}return x}
window.renderAt=function(t){
 const x=camX(t);
 let z=1;if(t<B(10))z=1+.025*cl(t/BIG)+.13*smooth((t-BIG)/(TITLE-BIG)); // intro push-in
 const k=Math.round(x/GAP);const local=t-B(SB[Math.min(k,SB.length-1)]);if(t>=B(10))z=1+.012*cl(local/8);
 cam.style.transform=`scale(${z}) translateX(${-x}px)`;
 scenes.forEach((d,i)=>d.style.display=Math.abs(i*GAP-x)<2400?'block':'none');
 // scene-0 depth of field and dim under the title
 const dof=7*smooth((t-BIG-.2)/1.6);bg0.forEach(c=>{c.blur=dof});S0.blur=8*smooth((t-TITLE+.05)/.35);
 for(const a of A){
  if(a.kind==='slam'||a.kind==='drop'){place(a,t);continue}
  const u=t-a.t;
  if(a.kind==='fade')a.el.style.opacity=cl(u/a.dur);
  if(a.kind==='write'){a.el.style.opacity=u<0?0:1;a.el.firstChild.style.clipPath=`inset(-20% ${100-100*ease(u/a.dur)}% -20% 0)`}
  if(a.kind==='draw'){a.el.style.opacity=u<0?0:1;a.el.querySelectorAll('[data-draw]').forEach(p=>{if(p.dataset.dash){p.style.strokeDasharray=p.dataset.dash;p.closest('svg').style.clipPath=`inset(0 ${100-100*ease(u/a.dur)}% 0 0)`}else p.setAttribute('stroke-dashoffset',1000-1000*ease(u/a.dur))})}
  if(a.kind==='bar')a.el.querySelector('.bar').style.width=(a.p*ease(u/.6))+'%';
  if(a.kind==='dots'){const n=Math.round(a.n*ease(u/1.4));a.el.querySelectorAll('.dots i').forEach((d,i)=>d.style.background=i<n?'#b3261e':'#17130f2e')}
  if(a.kind==='show')a.el.querySelector(a.sel).style.opacity=cl(u/.25);
 }
 dust.forEach(p=>{const dt=t-p.c.t;if(dt<0||dt>p.life){p.d.style.opacity=0;return}const u=dt/p.life;const r=p.sp*ease(u);
  p.d.style.left=(p.ox+Math.cos(p.a)*r)+'px';p.d.style.top=(p.oy+Math.sin(p.a)*r*.7)+'px';p.d.style.opacity=(1-u)*.7});
 subs.forEach(o=>{const on=t>=o.a&&t<o.b;const u=cl((t-o.a)/.18),v=cl((o.b-t)/.12);o.d.style.opacity=on?Math.min(u,v):0;o.d.style.transform=`translateX(-50%) translateY(${(1-ease(u))*24}px) rotate(-.8deg)`});
 // title
 const tu=t-TITLE;title.style.opacity=tu<-.11?0:1;
 title.style.transform=`scale(${tu<0?1.5-.5*easeIn(1+tu/.11):1-Math.exp(-tu*14)*Math.sin(tu*38)*.015})`;
 const gu=t-(TITLE+.3);tag.style.opacity=cl(gu/.15);tag.style.transform=`translateY(${(1-ease(gu/.25))*20}px)`;
 const dim=smooth((t-TITLE+.05)/.35);[...bg0,S0].forEach(c=>{c.el.style.filter+=dim>0?` brightness(${1-.68*dim})`:''});
 scenes[0].querySelectorAll('.clip').forEach(e=>{if(e!==title&&e!==tag&&!bg0.some(c=>c.el===e)&&e!==S0.el&&dim>0)e.style.opacity=Math.min(+e.style.opacity||0,1-dim)});
 // end card
 const eu=t-END;end.style.opacity=cl(eu/.4);end.firstChild.style.transform=`scale(${1+.03*(1-ease(eu/.6))})`;
 
};
window.READY=true;renderAt(+(new URLSearchParams(location.search).get('t')||0));
