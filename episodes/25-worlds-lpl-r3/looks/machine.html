<!doctype html><html><head><meta charset="utf-8"><style>

</style>

</head><body><div id="gl"></div><div class="tag" id="tag"></div><div id="hud"></div>
<script type="module">

const Q=new URLSearchParams(location.search),LOOK=Q.get('look')||'A',F=Q.get('f')||'machine';
const LK={
 A:{name:'黑金决赛场',bg:'#07060a',fog:'#0b0910',peg:'#F6CF78',pegE:1.2,board:'#14110c',rail:'#F6CF78',lpl:'#FF4560',lck:'#4f9dff',oth:'#e9e2d0',q:'#F6CF78',e:'#5a5560',font:'Noto Serif CJK SC',sub:'rgba(6,8,13,.0)',bloom:[.55,.5,.7],floor:'#0d0b08',exp:1.0},
 B:{name:'海克斯蓝图',bg:'#04121f',fog:'#06182a',peg:'#6fe3ff',pegE:1.4,board:'#072238',rail:'#6fe3ff',lpl:'#ff5a6e',lck:'#ffe27a',oth:'#d8f4ff',q:'#7dffb0',e:'#3a5a74',font:'Noto Sans CJK SC',sub:'rgba(0,0,0,0)',bloom:[.5,.45,.7],floor:'#041626',exp:1.05},
 C:{name:'霓虹弹珠',bg:'#12041c',fog:'#1a0628',peg:'#ff4fd8',pegE:2.0,board:'#1c0830',rail:'#39f3ff',lpl:'#ff3b5c',lck:'#39f3ff',oth:'#fff3a8',q:'#7dff8a',e:'#5b3a70',font:'Noto Sans CJK SC',sub:'rgba(0,0,0,0)',bloom:[.7,.55,.6],floor:'#120420',exp:1.1}}[LOOK];
document.getElementById('tag').textContent=`LOOK ${LOOK} · ${LK.name} · ${F}`;
const R=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});R.setPixelRatio(1);R.setSize(1920,1080);R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=LK.exp;
document.getElementById('gl').appendChild(R.domElement);
const S=new THREE.Scene();S.background=new THREE.Color(LK.bg);S.fog=new THREE.Fog(LK.fog,40,140);
const cam=new THREE.PerspectiveCamera(36,16/9,.1,500);
S.add(new THREE.HemisphereLight('#ffffff','#202030',.55));const key=new THREE.DirectionalLight('#fff1dc',1.2);key.position.set(-20,40,30);S.add(key);
const glow=c=>new THREE.MeshBasicMaterial({color:new THREE.Color(c).multiplyScalar(LK.pegE),toneMapped:false});
// ---------- the Swiss tree: node (w,l) sits on row r=w+l, x by w-l
const XS=2.6, YS=2.7, Y0=8.2;
const pos=(w,l)=>new THREE.Vector3((w-l)*XS, Y0-(w+l)*YS, 0);
const bt=(()=>{const c=document.createElement('canvas');c.width=2048;c.height=1566;const x=c.getContext('2d');x.fillStyle=LK.board;x.fillRect(0,0,c.width,c.height);
 if(LOOK==='A'){for(let i=0;i<900;i++){x.strokeStyle=`rgba(246,207,120,${.02+Math.random()*.03})`;x.beginPath();const y=Math.random()*c.height;x.moveTo(0,y);x.lineTo(c.width,y+Math.random()*4-2);x.stroke();}}
 if(LOOK==='B'){x.strokeStyle='rgba(111,227,255,.12)';x.lineWidth=1;for(let i=0;i<c.width;i+=32){x.beginPath();x.moveTo(i,0);x.lineTo(i,c.height);x.stroke();}for(let j=0;j<c.height;j+=32){x.beginPath();x.moveTo(0,j);x.lineTo(c.width,j);x.stroke();}x.strokeStyle='rgba(111,227,255,.25)';x.lineWidth=2;for(let i=0;i<c.width;i+=160){x.beginPath();x.moveTo(i,0);x.lineTo(i,c.height);x.stroke();}for(let j=0;j<c.height;j+=160){x.beginPath();x.moveTo(0,j);x.lineTo(c.width,j);x.stroke();}}
 if(LOOK==='C'){for(let i=-c.height;i<c.width;i+=90){x.strokeStyle=i%180?'rgba(255,79,216,.10)':'rgba(57,243,255,.10)';x.lineWidth=26;x.beginPath();x.moveTo(i,0);x.lineTo(i+c.height,c.height);x.stroke();}}
 const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;})();
const board=new THREE.Mesh(new THREE.BoxGeometry(34,26,.6),[0,1,2,3].map(()=>new THREE.MeshStandardMaterial({color:LK.board,roughness:.35,metalness:.6})).concat([new THREE.MeshStandardMaterial({map:bt,roughness:.4,metalness:.4}),new THREE.MeshStandardMaterial({color:LK.board})]));board.position.set(0,-.6,-1.1);S.add(board);
const glass=new THREE.Mesh(new THREE.PlaneGeometry(34,26),new THREE.MeshPhysicalMaterial({color:'#ffffff',roughness:.05,transparent:true,opacity:.06,depthWrite:false}));glass.position.set(0,-.6,1.2);S.add(glass);
// rails (frame)
for(const [x,y,w,h] of [[0,12.4,34.4,.35],[0,-13.6,34.4,.35],[-17.1,-.6,.35,26.4],[17.1,-.6,.35,26.4]]){const m=new THREE.Mesh(new THREE.BoxGeometry(w*.6+ (w>h?w*.4:0),h,.3),new THREE.MeshBasicMaterial({color:new THREE.Color(LK.rail).multiplyScalar(.45),toneMapped:false}));m.position.set(x,y,-.6);S.add(m);}
// edges between states
const edgeMat=new THREE.MeshBasicMaterial({color:new THREE.Color(LK.peg).multiplyScalar(.5),transparent:true,opacity:.5,toneMapped:false});
const nodes=[];
for(let w=0;w<=3;w++)for(let l=0;l<=3;l++){if(w===3&&l===3)continue;if(w+l>5)continue;const term=w===3||l===3;nodes.push({w,l,term});}
for(const n of nodes){if(n.term)continue;for(const [dw,dl] of [[1,0],[0,1]]){const a=pos(n.w,n.l),b=pos(n.w+dw,n.l+dl);const len=a.distanceTo(b);
 const e=new THREE.Mesh(new THREE.CylinderGeometry(.045,.045,len,8),edgeMat);e.position.copy(a).add(b).multiplyScalar(.5);e.position.z=-.3;e.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),b.clone().sub(a).normalize());S.add(e);}}
// pegs and terminal bins
function label(text,col,size=64,font=LK.font){const c=document.createElement('canvas');c.width=512;c.height=128;const x=c.getContext('2d');x.font=`900 ${size}px "${font}"`;x.fillStyle=col;x.textAlign='center';x.textBaseline='middle';x.fillText(text,256,64);
 const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;const m=new THREE.Mesh(new THREE.PlaneGeometry(4,1),new THREE.MeshBasicMaterial({map:t,transparent:true,toneMapped:false,depthWrite:false}));return m;}
for(const n of nodes){const p=pos(n.w,n.l);
 if(!n.term){const peg=new THREE.Mesh(new THREE.CylinderGeometry(.62,.62,1.4,40),new THREE.MeshStandardMaterial({color:'#222',roughness:.25,metalness:.9}));peg.rotation.x=Math.PI/2;peg.position.copy(p);S.add(peg);
  const ring=new THREE.Mesh(new THREE.TorusGeometry(.66,.07,12,48),glow(LK.peg));ring.position.copy(p).setZ(.28);S.add(ring);
  const lb=label(`${n.w}-${n.l}`,'#ffffff',60,'Inter Display');lb.scale.set(.5,.5,1);lb.position.copy(p).setZ(.74);S.add(lb);}
 else{const q=n.w===3;const bin=new THREE.Mesh(new THREE.BoxGeometry(2.4,1.9,1.2),new THREE.MeshPhysicalMaterial({color:new THREE.Color(q?LK.q:LK.e),roughness:.08,transparent:true,opacity:.22,depthWrite:false,emissive:new THREE.Color(q?LK.q:LK.e).multiplyScalar(q?.12:.04)}));bin.position.copy(p).setY(p.y-.2);S.add(bin);
  const lip=new THREE.Mesh(new THREE.BoxGeometry(2.4,.12,.9),glow(q?LK.q:LK.e));lip.position.copy(p).setY(p.y+.6);S.add(lip);
  const lb=label(q?`${n.w}-${n.l} 晋级`:`${n.w}-${n.l} 淘汰`,q?LK.q:'#9a97a6',58);lb.scale.set(1.1,1.1,1);lb.position.copy(p).setY(p.y-1.75).setZ(.8);S.add(lb);}}
const top=label('0-0  ·  16 支队','#ffffff',56);top.scale.set(1.1,1.1,1);top.position.set(0,Y0+2.1,.4);S.add(top);
// ---------- balls: each one a simulated run of one team (region colour). Positions are a pure function of t.
let sd=11;const rnd=()=>(sd=(sd*16807)%2147483647)/2147483647;
const NB=900,REGS=[['lpl',.25],['lck',.25],['oth',.5]];
const balls=[];for(let i=0;i<NB;i++){let w=0,l=0;const path=[[0,0]];const r=rnd();const reg=r<.25?'lpl':r<.5?'lck':'oth';const pw=reg==='lck'?.62:reg==='lpl'?.55:.42;
 while(w<3&&l<3){if(rnd()<pw)w++;else l++;path.push([w,l]);}balls.push({path,reg,t0:rnd()*9,sp:.85+rnd()*.35,jit:(rnd()-.5)*.5,jz:(rnd()-.5)*.5});}
// slot index of each ball inside its final bin (for the pile)
{const c={};for(const b of balls){const k=b.path[b.path.length-1].join('-');b.slot=c[k]=(c[k]||0)+1;}}
const geo=new THREE.SphereGeometry(.17,14,10);const mats={lpl:glow(LK.lpl),lck:glow(LK.lck),oth:new THREE.MeshStandardMaterial({color:LK.oth,roughness:.2,metalness:.8,emissive:new THREE.Color(LK.oth).multiplyScalar(.25)})};
const ghost={};for(const k of ['lpl','lck','oth']){const gm=mats[k].clone();gm.transparent=true;gm.opacity=.35;ghost[k]=new THREE.InstancedMesh(geo,gm,NB*2);ghost[k].count=0;ghost[k].frustumCulled=false;S.add(ghost[k]);}
const inst={};for(const k of ['lpl','lck','oth']){inst[k]=new THREE.InstancedMesh(geo,mats[k],NB);inst[k].count=0;inst[k].frustumCulled=false;S.add(inst[k]);}
// piles in bins grow with time
const M=new THREE.Matrix4(),V=new THREE.Vector3(),Qn=new THREE.Quaternion(),ONE=new THREE.Vector3(1,1,1);
function ballPos(b,t,out){const tt=(t-b.t0)*b.sp;const hop=.62;const seg=Math.floor(tt/hop);if(tt<0)return false;
 const p=b.path;if(seg>=p.length-1){// resting in its bin
  const [w,l]=p[p.length-1];const c=pos(w,l);const k=b.slot;if(k>30)return false;out.set(c.x-.9+(k%6)*.36,c.y-.8+Math.floor(k/6)*.3,.1+((k*7)%3)*.12);return true;}
 const u=tt/hop-seg;const a=pos(...p[seg]),c=pos(...p[seg+1]);out.lerpVectors(a,c,u);out.y+= Math.sin(u*Math.PI)*.9;out.x+=b.jit*.4*Math.sin(u*Math.PI);out.z=.7+b.jz;return true;}
// ---------- camera + post
const comp=new EffectComposer(R);comp.addPass(new RenderPass(S,cam));const bl=new UnrealBloomPass(new THREE.Vector2(1920,1080),...LK.bloom);comp.addPass(bl);comp.addPass(new OutputPass());

// ---------- data panel: BP board + gold-difference curve of a real game, as a lit screen in the scene
let PANEL=null;
if(F==='panel'){
 const GD=await (await fetch('panel_game.json')).json();
 const load=src=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src});
 const icon=n=>load('icons/icon_'+GD.ids[n]+'.png');
 const pb=[];for(const sd of ['blue','red'])for(const n of [...GD[sd].picks,...GD[sd].bans])pb.push(icon(n).then(im=>[sd,n,im]));
 const IM={};for(const [sd,n,im] of await Promise.all(pb))IM[n]=im;
 const W=2400,H=1350,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
 const col={LPL:LK.lpl,LCK:LK.lck};const teamCol={IG:col.LPL,GEN:col.LCK};
 x.fillStyle=LOOK==='B'?'#061c30':LOOK==='C'?'#1a0628':'#0e0c09';x.fillRect(0,0,W,H);
 x.font=`900 64px "${LK.font}"`;x.fillStyle='#fff';x.textBaseline='middle';x.fillText('瑞士轮首轮 · BO1',80,90);
 x.font='900 40px "Inter Display"';x.globalAlpha=.6;x.fillText('26:01',W-240,90);x.globalAlpha=1;
 const row=(sd,y)=>{const t=GD[sd];x.font='900 90px "Inter Display"';x.fillStyle=teamCol[t.team];x.fillText(t.team,80,y);
  x.font=`900 34px "${LK.font}"`;x.fillStyle=t.res==='WIN'?LK.q:'#9a97a6';x.fillText(t.res==='WIN'?'胜':'负',80,y+70);
  t.picks.forEach((n,i)=>{const im=IM[n];const X=420+i*190;if(im){x.save();x.beginPath();x.roundRect(X,y-80,160,160,22);x.clip();x.drawImage(im,X,y-80,160,160);x.restore();}
   x.strokeStyle=teamCol[t.team];x.lineWidth=6;x.beginPath();x.roundRect(X,y-80,160,160,22);x.stroke();});
  t.bans.filter(n=>IM[n]).forEach((n,i)=>{const X=1420+i*150;x.save();x.globalAlpha=.6;x.filter='grayscale(1)';x.beginPath();x.arc(X+60,y,60,0,7);x.clip();x.drawImage(IM[n],X,y-60,120,120);x.restore();
   x.strokeStyle='#ff4560';x.lineWidth=7;x.beginPath();x.moveTo(X+18,y-42);x.lineTo(X+102,y+42);x.stroke();});};
 row('blue',260);row('red',490);
 x.font=`900 30px "${LK.font}"`;x.fillStyle='#fff';x.globalAlpha=.55;x.fillText('禁用',1420,150);x.globalAlpha=1;
 // gold curve (blue side = IG positive)
 const gx0=80,gx1=W-80,gy=850,gs=.032,gd=GD.gd,n=gd.length-1;const X=i=>gx0+(gx1-gx0)*i/n,Y=v=>gy-v*gs;
 x.strokeStyle='rgba(255,255,255,.18)';x.lineWidth=2;x.beginPath();x.moveTo(gx0,gy);x.lineTo(gx1,gy);x.stroke();
 for(const sg of [1,-1]){x.save();x.beginPath();x.rect(0,sg>0?0:gy,W,sg>0?gy:H);x.clip();x.beginPath();x.moveTo(X(0),gy);gd.forEach((v,i)=>x.lineTo(X(i),Y(v)));x.lineTo(X(n),gy);x.closePath();
  x.fillStyle=(sg>0?teamCol.IG:teamCol.GEN)+'55';x.fill();x.restore();}
 x.strokeStyle='#fff';x.lineWidth=6;x.beginPath();gd.forEach((v,i)=>i?x.lineTo(X(i),Y(v)):x.moveTo(X(i),Y(v)));x.stroke();
 const i15=15;x.fillStyle=teamCol.IG;x.beginPath();x.arc(X(i15),Y(gd[i15]),14,0,7);x.fill();
 x.font=`900 46px "${LK.font}"`;x.fillStyle=teamCol.IG;x.fillText(`15分钟：IG 领先 ${(gd[i15]/1000).toFixed(1)}k`,X(i15)-220,Y(gd[i15])-60);
 x.fillStyle=teamCol.GEN;x.fillText(`终局：落后 ${(-gd[n]/1000).toFixed(1)}k`,X(n)-520,Y(gd[n])+10);
 x.font=`900 34px "${LK.font}"`;x.fillStyle='rgba(255,255,255,.6)';x.fillText('经济差（IG 视角）',gx0,640);
 const tex=new THREE.CanvasTexture(c);tex.colorSpace=THREE.SRGBColorSpace;tex.anisotropy=8;
 const g=new THREE.Group();const scr=new THREE.Mesh(new THREE.PlaneGeometry(24,13.5),new THREE.MeshBasicMaterial({map:tex,toneMapped:false,color:new THREE.Color(.9,.9,.9)}));g.add(scr);
 const fr=new THREE.Mesh(new THREE.BoxGeometry(24.6,14.1,.4),new THREE.MeshBasicMaterial({color:new THREE.Color(LK.rail).multiplyScalar(.7),toneMapped:false}));fr.position.z=-.25;g.add(fr);
 g.position.set(-6,-1,9);g.rotation.y=.32;S.add(g);PANEL=g;}

// floor reflection plane
const floor=new THREE.Mesh(new THREE.PlaneGeometry(300,300),new THREE.MeshStandardMaterial({color:LK.floor,roughness:.3,metalness:.6}));floor.rotation.x=-Math.PI/2;floor.position.y=-14;S.add(floor);
window.renderAt=t=>{
 const cnt={lpl:0,lck:0,oth:0};
 const gc={lpl:0,lck:0,oth:0};const SC=new THREE.Vector3();
 for(const b of balls){if(ballPos(b,t,V)){M.compose(V,Qn,ONE);inst[b.reg].setMatrixAt(cnt[b.reg]++,M);
   const tt=(t-b.t0)*b.sp;if(tt/.62<b.path.length-1){for(const [dt,sc] of [[.045,.75],[.09,.5]]){if(ballPos(b,t-dt,V)){SC.setScalar(sc);M.compose(V,Qn,SC);ghost[b.reg].setMatrixAt(gc[b.reg]++,M);}}}}}
 for(const k in inst){inst[k].count=cnt[k];inst[k].instanceMatrix.needsUpdate=true;ghost[k].count=gc[k];ghost[k].instanceMatrix.needsUpdate=true;}
 if(F==='machine'){cam.position.set(11,-8,29);cam.lookAt(-.5,-1.4,0);cam.fov=40;cam.updateProjectionMatrix();}
 else{cam.position.set(1,-1.2,36);cam.lookAt(-5.2,-1.4,7);}

hud.innerHTML=F==='panel'?`<div class="sub" style="background:rgba(6,8,13,.80)">IG 15分钟领先<b>1.9k</b>，还是输了</div>`:`<div class="sub" style="background:rgba(6,8,13,.80)">20万颗弹珠，每一颗都是<b>一届世界赛</b></div>`;
