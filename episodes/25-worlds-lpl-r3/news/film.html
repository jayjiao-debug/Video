function place(c,t){
 const FALL=c.large?.4:c.big?.22:.14, dt=t-c.t;
 if(dt<-FALL){c.el.style.opacity=0;return}
 let sc=1,op=1,rot=c.rot,sh=c.sh,bl=22,dy=0;
 if(dt<0){const u=1+dt/FALL,e=easeIn(u);
  if(c.large){const e2=ease(u);dy=-(1-e2)*1150;rot=c.rot-3*(1-e2);sh=60-42*e2;bl=44-22*e2}   // big sheets slide in from above: no sudden bright frame
  else if(c.big){sc=1.12-.12*e;dy=-(1-e)*1000;rot=c.rot-6*(1-e);sh=70-52*e;bl=50-28*e}
  else{sc=1.25-.25*e;op=cl(u*1.6);rot=c.rot+6*(1-e);sh=70-52*e;bl=50-28*e}}
 else{const b=Math.exp(-dt*14)*Math.sin(dt*38)*.012;sc=1-b}
 c.el.style.opacity=op;c.el.style.transform=`translateY(${dy}px) rotate(${rot}deg) scale(${sc})`;
 c.el.style.filter=`drop-shadow(0 ${sh}px ${bl}px rgba(0,0,0,.55))${c.blur>.05?` blur(${c.blur.toFixed(2)}px)`:''}`;
}

};
