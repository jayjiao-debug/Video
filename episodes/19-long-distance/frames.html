<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;overflow:hidden;font-family:"Noto Sans CJK SC",sans-serif;background:#070a14}
.f{position:absolute;inset:0;overflow:hidden;background:radial-gradient(ellipse at 50% 45%,#16203d 0%,#0b1022 60%,#05070e 100%)}
.sub{position:absolute;left:0;right:0;bottom:70px;text-align:center;z-index:40}
.sub span{display:inline-block;background:rgba(6,8,13,.80);color:#fff;font-size:64px;font-weight:900;padding:10px 34px 14px;border-radius:18px}
.sub b{color:#F6CF78}.t{position:absolute;font-weight:900}.serif{font-family:"Noto Serif CJK SC",serif}
.mark{position:absolute;right:44px;top:34px;font-size:22px;font-weight:700;letter-spacing:2px;color:#f6cf78;opacity:.6}
</style></head><body><div id="root"></div>
<script>
const sub=t=>`<div class="sub"><span>${t.replace(/\[(.+?)\]/g,'<b>$1</b>')}</span></div>`;const mark=`<div class="mark">◆ Juno · VIBE知识大赏</div>`;
const G='#F6CF78',P='#FF9DB0',GL='rgba(246,207,120,';
const glow=(x,y,r,c='rgba(246,207,120,.16)')=>`<div style="position:absolute;left:${x-r}px;top:${y-r}px;width:${2*r}px;height:${2*r}px;border-radius:50%;background:radial-gradient(circle,${c},rgba(0,0,0,0) 62%)"></div>`;
const phone=(x,y,s,inner,rot=0)=>`<div style="position:absolute;left:${x-110*s}px;top:${y-220*s}px;width:${220*s}px;height:${440*s}px;border-radius:${34*s}px;background:#0d1018;box-shadow:0 20px 50px rgba(0,0,0,.6);padding:${9*s}px;transform:rotate(${rot}deg)"><div style="width:100%;height:100%;border-radius:${26*s}px;background:#151b2b;overflow:hidden;position:relative">${inner}</div></div>`;
// figure: head+body silhouette, no face
const fig=(x,floor,h,c,soft=0)=>{const w=h*0.36,hd=h*0.16;return `<svg style="position:absolute;left:${x-w/2-20}px;top:${floor-h-20}px;overflow:visible;${soft?`filter:drop-shadow(0 0 ${soft}px rgba(255,180,200,.9))`:''}" width="${w+40}" height="${h+40}" viewBox="-20 -20 ${w+40} ${h+40}"><circle cx="${w/2}" cy="${hd}" r="${hd}" fill="${c}"/><path d="M${w*0.08} ${h} L${w*0.1} ${hd*2.35} Q${w/2} ${hd*1.75} ${w*0.9} ${hd*2.35} L${w*0.92} ${h} Z" fill="${c}"/></svg>`;};
const heart=(x,y,s,c,broken=false)=>`<svg style="position:absolute;left:${x-50*s}px;top:${y-45*s}px" width="${100*s}" height="${90*s}" viewBox="0 0 100 90"><path d="M50 85 C 10 60 0 35 15 18 C 28 4 45 8 50 22 C 55 8 72 4 85 18 C 100 35 90 60 50 85 Z" fill="${c}"/>${broken?'<path d="M50 22 L42 40 L56 52 L46 70 L50 85" fill="none" stroke="#0b1022" stroke-width="6" stroke-linejoin="round"/>':''}</svg>`;
const F={
F1:()=>`<div class="f">${mark}${glow(330,480,330)}${glow(1590,480,330,'rgba(255,157,176,.14)')}
 ${phone(330,480,1.2,`<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center">${fig(132,420,260,'#2c3a66')}</div>`)}
 ${phone(1590,480,1.2,`<div style="position:absolute;inset:0">${fig(132,420,260,'#5b3a52')}</div>`)}
 <svg style="position:absolute;left:0;top:0" width="1920" height="1080"><path d="M470 470 C 800 380 1120 380 1450 470" fill="none" stroke="${G}" stroke-width="5" stroke-dasharray="2 14" stroke-linecap="round" opacity=".9"/></svg>
 <div class="t serif" style="left:780px;top:300px;font-size:110px;color:${G}">1,200 km</div>
 ${sub('你和TA，隔着[1200公里]')}</div>`,
F2:()=>{const bub=(x,y,w,t,c,o)=>`<div style="position:absolute;left:${x}px;top:${y}px;max-width:${w}px;padding:16px 24px;border-radius:22px;background:${c};font-size:30px;color:#2a2018;opacity:${o};box-shadow:0 0 40px ${GL}.35)">${t}</div>`;
 return `<div class="f">${mark}
 ${phone(250,480,1.0,'')}${phone(1670,480,1.0,'')}
 <svg style="position:absolute;left:0;top:0" width="1920" height="1080"><path d="M370 470 C 760 400 1160 400 1550 470" fill="none" stroke="${G}" stroke-width="4" stroke-dasharray="2 14" stroke-linecap="round" opacity=".6"/></svg>
 ${bub(480,300,260,'在干嘛','#e9e3d6',.55)}${bub(760,240,420,'今天其实有点难过，想跟你说说…','#F6E2B8',.85)}${bub(1120,330,440,'我小时候最怕的事，好像从没跟别人讲过','#FFD9A0',1)}
 <div class="t" style="left:640px;top:610px;font-size:46px;color:${G}">见不到 → 说得更多、更深</div>
 ${sub('因为见不到，[说得更多]')}</div>`},
F3:()=>`<div class="f">${mark}${glow(960,460,420,'rgba(255,157,176,.18)')}
 ${phone(960,470,1.7,`<div style="position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,#5a3a5e,#241a33)"></div>${fig(187,690,430,'#ffc4d0',26)}
  <div style="position:absolute;left:30px;top:40px;font-size:30px;color:#fff;font-weight:900;background:rgba(255,157,176,.5);padding:6px 18px;border-radius:999px">✨ 自动美颜</div>
  ${[[60,200],[300,150],[90,470],[310,420],[200,90]].map(([x,y])=>`<div style="position:absolute;left:${x}px;top:${y}px;font-size:34px;color:#fff">✦</div>`).join('')}`)}
 ${sub('隔着屏幕，你会[自动美颜]')}</div>`,
F4:()=>`<div class="f">${mark}${glow(960,560,420)}
 ${fig(890,820,380,'#2c3a66')}${fig(1030,820,370,'#5b3a52')}
 <div style="position:absolute;left:0;right:0;top:820px;height:2px;background:${GL}.25)"></div>
 <div class="t serif" style="left:820px;top:200px;font-size:150px;color:${G}">0 km</div>
 <div class="t" style="left:1180px;top:500px;font-size:34px;color:#9aa2b4;text-decoration:line-through">1,200 km</div>
 ${sub('距离，终于变成了[0]')}</div>`,
F5:()=>`<div class="f">${mark}
 ${heart(560,470,2.1,G)}${heart(960,470,2.1,G)}${heart(1360,470,2.1,'#ff6a5a',true)}
 <div class="t serif" style="left:1240px;top:620px;font-size:52px;color:#ff8a7a">3个月内</div>
 <div class="t serif" style="left:700px;top:160px;font-size:120px;color:#fff">约 <span style="color:#ff8a7a">1/3</span></div>
 ${sub('团聚后[3个月]内，约三分之一分手')}</div>`,
F6:()=>`<div class="f">${mark}
 ${phone(560,470,1.4,`<div style="position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,#5a3a5e,#241a33)"></div>${fig(154,560,360,'#ffc4d0',22)}<div style="position:absolute;left:24px;top:30px;font-size:24px;color:#fff;font-weight:900;background:rgba(255,157,176,.5);padding:4px 14px;border-radius:999px">✨ 美颜</div>`)}
 <div class="t" style="left:860px;top:430px;font-size:80px;color:${G}">→</div>
 ${fig(1300,820,440,'#8b8fa3')}
 ${[['以前看不到的缺点',1440,300],['没了自己的时间',1470,470],['吵架 · 吃醋',1450,640]].map(([t,x,y])=>`<div class="t" style="left:${x}px;top:${y}px;font-size:36px;color:#e9e3d6;background:rgba(255,255,255,.07);padding:10px 22px;border-radius:14px;border:2px solid rgba(255,255,255,.15)">${t}</div>`).join('')}
 ${sub('见面以后，美颜[关掉了]')}</div>`,
F7:()=>`<div class="f" style="background:radial-gradient(ellipse at 50% 40%,#3a2f4e 0%,#191a33 55%,#070912 100%)">${mark}${glow(960,520,500,'rgba(255,200,150,.22)')}
 ${fig(900,820,380,'#3b4a7a')}${fig(1020,820,370,'#7a4a66')}
 <div class="t serif" style="left:600px;top:200px;font-size:84px;color:${G}">见面以后，才是真正的考试</div>
 ${sub('学会爱一个，[不美颜的TA]')}</div>`,
};
const id=new URLSearchParams(location.search).get('f');document.getElementById('root').innerHTML=F[id]();document.fonts.ready.then(()=>{window.READY=true});
</script></body></html>
